volumes:
  spesen-db-data:

services:
  spesen-db:
    image: mariadb:11
    container_name: spesen-db
    env_file:
      - .env
    environment:
      MARIADB_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      MARIADB_DATABASE: ${MYSQL_DATABASE}
    volumes:
      - spesen-db-data:/var/lib/mysql
    ports:
      - "${MYSQL_PORT:-53306}:3306"
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 5s
      timeout: 5s
      retries: 10
